$kind: http-request
name: Transfer
method: POST
url: '{{baseUrl}}/api/finance/transfer'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "receiverLogin": "string",
      "amount": 50.00
    }
