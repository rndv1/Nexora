$kind: http-request
name: Register
method: POST
url: '{{baseUrl}}/api/user/register'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "login": "string",
      "name": "string",
      "passwordHash": "string"
    }
