services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5196:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=Nexora;Username=Nexora;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "guest"
      RabbitMq__Password: "guest"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: Nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: Nexora
    ports:
      - "5434:5432"
    volumes:
      - pg_nexora_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Nexora -d Nexora"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672" 
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  tax-inspection:
    build:
      context: .
      dockerfile: Nexora.TaxInspection.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "guest"
      RabbitMq__Password: "guest"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pg_nexora_data:
  rabbitmq_data:
